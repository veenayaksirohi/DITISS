- name: install apache2 using apt (debian based distro) or yum (RH based distro)
  hosts: servers
  become: yes
  tasks:
    - name: install apache2 using apt
      apt:
        name: apache2
        state: present
      when: ansible_facts['os_family'] == 'Debian'

    - name: install apache2 using yum
      yum:
        name: httpd
        state: present
      when: ansible_facts['os_family'] == 'RedHat'
